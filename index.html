    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
            padding: 28px 24px 32px;
            max-width: 820px;
            width: 100%;
            text-align: center;
        }
        .card {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            margin-bottom: 24px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #0d7a0d;
            color: white;
            padding: 14px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(13, 122, 13, 0.3);
        }
        .btn:hover {
            background: #0a5f0a;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(13, 122, 13, 0.4);
        }
        .footer {
            margin-top: 18px;
            color: #777;
            font-size: 13px;
        }
    </style>
